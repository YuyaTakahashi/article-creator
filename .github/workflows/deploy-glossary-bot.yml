name: 用語くん(GAS)をデプロイ

# main の pipeline/glossary-bot/ が変わったら、その中身を Apps Script プロジェクトへ反映する。
# 手元の Mac から clasp push する手間をなくすためのもの。
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/glossary-bot/**'
      - '.github/workflows/deploy-glossary-bot.yml'
  workflow_dispatch:

# 2本同時に走って push が競合しないようにする（後から来たほうを待たせる）
concurrency:
  group: deploy-glossary-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: clasp push
    runs-on: ubuntu-latest
    # フォーク先では Secrets が無く必ず失敗するので、本家リポジトリでだけ動かす
    if: github.repository == 'YuyaTakahashi/article-creator'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 予期しない破壊的変更でデプロイが壊れないようバージョンを固定する。
      # 上げるときは、先に手元で同じバージョンの clasp push を通してから上げること。
      - name: clasp をインストール
        run: npm install -g @google/clasp@3.4.1

      - name: 認証情報を書き出す
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "${CLASPRC_JSON}" ]; then
            echo "::error::Secrets に CLASPRC_JSON がありません。手元の ~/.clasprc.json の中身をそのまま登録してください（README の「用語くん(GAS)のデプロイ」参照）。"
            exit 1
          fi
          # 中身は絶対にログへ出さない（トークンそのもの）。JSONとして読めるかだけを終了コードで見る。
          if ! printf '%s' "${CLASPRC_JSON}" | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))' 2>/dev/null; then
            echo "::error::CLASPRC_JSON が JSON として読めません。~/.clasprc.json を丸ごと貼り直してください。"
            exit 1
          fi
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"
          chmod 600 "${HOME}/.clasprc.json"

      # -f は必須。appsscript.json に差分があると clasp は上書き確認のプロンプトを出すが、
      # CI は非対話なので確認できず「Skipping push.」と表示して *終了コード0のまま何もせず* 終わる。
      # -f が無いと「ジョブは緑なのに GAS へ反映されていない」事故になる。
      - name: GAS へ push
        working-directory: pipeline/glossary-bot
        run: clasp push -f

      - name: 認証情報を消す
        if: always()
        run: rm -f "${HOME}/.clasprc.json"
